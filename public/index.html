<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Birthday & Reminder App</title>
  <!-- Telegram Web App SDK -->
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    :root {
      --bg-base: #1e222d;
      --neu-surface: #232836;
      --neu-surface-hover: #262c3c;
      --neu-surface-pressed: #1b1e27;
      --neu-convex: linear-gradient(145deg, #262b3a, #202431);
      --neu-concave: linear-gradient(145deg, #202431, #262b3a);
      --shadow-dark: #14171e;
      --shadow-light: #2d3345;
      --shadow-inset-dark: #151820;
      --shadow-inset-light: #292f3f;
      
      --accent-primary: #6366f1;
      --accent-gradient: linear-gradient(145deg, #6b6ef9, #5457e5);
      --accent-glow: rgba(99, 102, 241, 0.35);
      
      --success: #10b981;
      --success-gradient: linear-gradient(145deg, #12c98d, #0ea573);
      --success-glow: rgba(16, 185, 129, 0.25);
      
      --warning: #f59e0b;
      --danger: #ef4444;
      --danger-gradient: linear-gradient(145deg, #f85858, #d93838);
      
      --text-main: #f3f6fb;
      --text-muted: #94a3b8;
      --text-sub: #64748b;
      
      --border-subtle: rgba(255, 255, 255, 0.04);
      --border-focus: rgba(99, 102, 241, 0.6);
      
      --radius-xl: 22px;
      --radius-lg: 16px;
      --radius-md: 12px;
      --radius-sm: 8px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background: var(--bg-base);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      overflow-x: hidden;
      padding-bottom: 86px;
      letter-spacing: -0.1px;
    }

    /* Ambient Subtle Backlight */
    .ambient-glow {
      position: fixed;
      top: -15%;
      left: 15%;
      width: 320px;
      height: 320px;
      background: radial-gradient(circle, rgba(99, 102, 241, 0.1) 0%, transparent 70%);
      pointer-events: none;
      z-index: 0;
    }

    .ambient-glow-2 {
      position: fixed;
      bottom: 5%;
      right: -10%;
      width: 360px;
      height: 360px;
      background: radial-gradient(circle, rgba(16, 185, 129, 0.08) 0%, transparent 70%);
      pointer-events: none;
      z-index: 0;
    }

    /* Sticky Neumorphic Header */
    header {
      position: sticky;
      top: 0;
      z-index: 100;
      background: var(--bg-base);
      box-shadow: 0 4px 14px var(--shadow-dark);
      border-bottom: 1px solid var(--border-subtle);
      padding: 14px 18px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 1.1rem;
      font-weight: 700;
      color: var(--text-main);
    }

    .brand-badge {
      background: var(--neu-surface);
      box-shadow: 2px 2px 5px var(--shadow-dark), -2px -2px 5px var(--shadow-light);
      color: var(--accent-primary);
      padding: 2px 8px;
      border-radius: 20px;
      font-size: 0.65rem;
      text-transform: uppercase;
      font-weight: 800;
      letter-spacing: 0.05em;
    }

    /* Notification Toast (Neumorphic Floating) */
    #toast-container {
      position: fixed;
      top: 68px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 300;
      max-width: 90%;
      width: 380px;
    }

    .toast {
      background: var(--neu-surface);
      box-shadow: 8px 8px 18px var(--shadow-dark), -8px -8px 18px var(--shadow-light);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-lg);
      padding: 12px 18px;
      margin-bottom: 10px;
      font-size: 0.88rem;
      display: flex;
      align-items: center;
      gap: 12px;
      animation: slideDown 0.25s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .toast.success { border-left: 4px solid var(--success); color: #bbf7d0; }
    .toast.error { border-left: 4px solid var(--danger); color: #fecaca; }

    @keyframes slideDown {
      from { transform: translateY(-12px); opacity: 0; }
      to { transform: translateY(0); opacity: 1; }
    }

    /* Main App Container */
    main {
      position: relative;
      z-index: 1;
      max-width: 580px;
      width: 100%;
      margin: 0 auto;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    /* Neumorphic Cards */
    .glass-card {
      background: var(--neu-surface);
      box-shadow: 8px 8px 18px var(--shadow-dark), -8px -8px 18px var(--shadow-light);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-xl);
      padding: 20px;
      position: relative;
    }

    .card-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 14px;
    }

    .card-title {
      font-size: 1.02rem;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 8px;
      color: var(--text-main);
    }

    /* Empty States */
    .empty-state {
      padding: 30px 16px;
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
      background: var(--bg-base);
      box-shadow: inset 4px 4px 8px var(--shadow-inset-dark), inset -4px -4px 8px var(--shadow-inset-light);
      border-radius: var(--radius-lg);
      margin: 4px 0;
    }

    .empty-state-icon {
      font-size: 2.2rem;
      margin-bottom: 2px;
    }

    .empty-state-title {
      font-size: 0.95rem;
      font-weight: 600;
      color: var(--text-main);
    }

    .empty-state-desc {
      font-size: 0.82rem;
      color: var(--text-muted);
      max-width: 270px;
      line-height: 1.4;
    }

    /* Stats Grid & Neumorphic Extrusions */
    .stats-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 14px;
    }

    .stat-box {
      background: var(--neu-surface);
      box-shadow: 5px 5px 12px var(--shadow-dark), -5px -5px 12px var(--shadow-light);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-lg);
      padding: 16px;
      text-align: center;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .stat-box:active {
      box-shadow: inset 3px 3px 6px var(--shadow-inset-dark), inset -3px -3px 6px var(--shadow-inset-light);
      transform: scale(0.98);
    }

    .stat-number {
      font-size: 1.75rem;
      font-weight: 700;
      color: var(--accent-primary);
      margin-top: 4px;
      text-shadow: 0 2px 10px var(--accent-glow);
    }

    .stat-label {
      font-size: 0.75rem;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.06em;
      font-weight: 600;
    }

    /* Neumorphic List Items */
    .item-list {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .list-item {
      background: var(--neu-surface);
      box-shadow: 5px 5px 11px var(--shadow-dark), -5px -5px 11px var(--shadow-light);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-lg);
      padding: 14px 18px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      transition: all 0.2s ease;
      cursor: pointer;
    }

    .list-item:hover {
      background: var(--neu-surface-hover);
    }

    .list-item:active {
      box-shadow: inset 3px 3px 6px var(--shadow-inset-dark), inset -3px -3px 6px var(--shadow-inset-light);
      transform: scale(0.99);
    }

    .item-info {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .item-title {
      font-weight: 600;
      font-size: 0.94rem;
      color: var(--text-main);
    }

    .item-subtitle {
      font-size: 0.8rem;
      color: var(--text-muted);
    }

    /* Neumorphic Buttons */
    .btn {
      background: var(--accent-gradient);
      color: white;
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: var(--radius-lg);
      padding: 10px 18px;
      font-size: 0.86rem;
      font-weight: 600;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      transition: all 0.2s ease;
      box-shadow: 4px 4px 10px var(--shadow-dark), -4px -4px 10px var(--shadow-light);
      text-shadow: 0 1px 2px rgba(0, 0, 0, 0.2);
    }

    .btn:hover:not(:disabled) {
      filter: brightness(1.06);
    }

    .btn:active:not(:disabled) {
      box-shadow: inset 3px 3px 6px rgba(0, 0, 0, 0.4), inset -3px -3px 6px rgba(255, 255, 255, 0.2);
      transform: scale(0.97);
    }

    .btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
      box-shadow: none !important;
    }

    .btn-secondary {
      background: var(--neu-surface);
      color: var(--text-main);
      border: 1px solid var(--border-subtle);
      box-shadow: 4px 4px 10px var(--shadow-dark), -4px -4px 10px var(--shadow-light);
    }

    .btn-secondary:hover:not(:disabled) {
      background: var(--neu-surface-hover);
    }

    .btn-secondary:active:not(:disabled) {
      box-shadow: inset 3px 3px 6px var(--shadow-inset-dark), inset -3px -3px 6px var(--shadow-inset-light);
      transform: scale(0.97);
    }

    .btn-success {
      background: var(--success-gradient);
      color: white;
      box-shadow: 4px 4px 10px var(--shadow-dark), -4px -4px 10px var(--shadow-light);
    }

    .btn-danger {
      background: var(--neu-surface);
      color: #f87171;
      border: 1px solid rgba(239, 68, 68, 0.25);
      box-shadow: 3px 3px 8px var(--shadow-dark), -3px -3px 8px var(--shadow-light);
    }

    .btn-danger:active:not(:disabled) {
      box-shadow: inset 2px 2px 5px var(--shadow-inset-dark), inset -2px -2px 5px var(--shadow-inset-light);
      color: #ef4444;
    }

    .btn-sm {
      padding: 6px 12px;
      font-size: 0.76rem;
      border-radius: var(--radius-md);
    }

    .btn-full {
      width: 100%;
      padding: 12px;
    }

    .btn-square {
      border-radius: var(--radius-md) !important;
      padding: 7px 13px !important;
      font-size: 0.82rem !important;
      font-weight: 600 !important;
      display: inline-flex !important;
      align-items: center !important;
      justify-content: center !important;
      gap: 5px !important;
    }

    /* Neumorphic Checkbox items */
    .checkbox-item {
      display: flex;
      align-items: center;
      gap: 12px;
      background: var(--neu-surface);
      box-shadow: 3px 3px 7px var(--shadow-dark), -3px -3px 7px var(--shadow-light);
      border: 1px solid var(--border-subtle);
      padding: 11px 16px;
      border-radius: var(--radius-lg);
      cursor: pointer;
      margin-bottom: 10px;
      transition: all 0.2s ease;
    }

    .checkbox-item:active {
      box-shadow: inset 2px 2px 5px var(--shadow-inset-dark), inset -2px -2px 5px var(--shadow-inset-light);
    }

    .checkbox-item input[type="checkbox"] {
      width: 19px;
      height: 19px;
      accent-color: var(--accent-primary);
      cursor: pointer;
    }

    /* Neumorphic Bottom Navigation Bar */
    nav.bottom-nav {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      z-index: 100;
      background: var(--bg-base);
      box-shadow: 0 -4px 16px var(--shadow-dark);
      border-top: 1px solid var(--border-subtle);
      display: flex;
      justify-content: space-around;
      padding: 8px 12px 10px;
    }

    .nav-tab {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 3px;
      color: var(--text-muted);
      font-size: 0.75rem;
      background: none;
      border: none;
      cursor: pointer;
      padding: 6px 16px;
      border-radius: var(--radius-lg);
      transition: all 0.2s ease;
    }

    .nav-tab.active {
      color: var(--accent-primary);
      font-weight: 700;
      background: var(--bg-base);
      box-shadow: inset 3px 3px 6px var(--shadow-inset-dark), inset -3px -3px 6px var(--shadow-inset-light);
    }

    .nav-tab .icon {
      font-size: 1.25rem;
    }

    /* Neumorphic Modal Dialog */
    .modal-backdrop {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(10, 12, 17, 0.78);
      backdrop-filter: blur(6px);
      -webkit-backdrop-filter: blur(6px);
      z-index: 200;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
    }

    .modal-content {
      background: var(--neu-surface);
      box-shadow: 12px 12px 28px #101218, -12px -12px 28px #2c3344;
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-xl);
      padding: 24px;
      max-width: 480px;
      width: 100%;
      animation: modalPop 0.22s cubic-bezier(0.16, 1, 0.3, 1);
    }

    @keyframes modalPop {
      from { transform: scale(0.95); opacity: 0; }
      to { transform: scale(1); opacity: 1; }
    }

    .input-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
      margin-bottom: 14px;
    }

    .input-group label {
      font-size: 0.8rem;
      color: var(--text-muted);
      font-weight: 600;
      letter-spacing: 0.02em;
    }

    /* Inset Neumorphic Input Cavities */
    .input-control {
      background: var(--bg-base);
      box-shadow: inset 3px 3px 6px var(--shadow-inset-dark), inset -3px -3px 6px var(--shadow-inset-light);
      border: 1px solid var(--border-subtle);
      color: var(--text-main);
      padding: 11px 14px;
      border-radius: var(--radius-md);
      font-size: 0.92rem;
      outline: none;
      transition: all 0.2s ease;
    }

    .input-control:focus {
      border-color: var(--border-focus);
      box-shadow: inset 3px 3px 6px var(--shadow-inset-dark), inset -3px -3px 6px var(--shadow-inset-light), 0 0 0 2px rgba(99, 102, 241, 0.2);
    }

    .hidden {
      display: none !important;
    }
  </style>
</head>
<body>
  <div class="ambient-glow"></div>
  <div class="ambient-glow-2"></div>

  <!-- Toast Notification Container -->
  <div id="toast-container"></div>

  <!-- Sticky Header -->
  <header>
    <div class="brand">
      <span style="font-weight: 700; font-size: 1rem; letter-spacing: -0.3px;">🎂 Reminders</span>
    </div>
    <div class="header-actions" style="display: flex; align-items: center; gap: 8px;">
      <button class="btn btn-sm btn-square" onclick="openAddPersonModal()" title="Add Person">➕ Add Person</button>
    </div>
  </header>

  <!-- Main View Container -->
  <main id="app-root">
    <!-- View 1: Normal Dashboard -->
    <section id="view-dashboard" class="tab-view">
      <div class="glass-card" style="margin-bottom: 12px;">
        <h2 id="greeting-title" style="font-size: 1.2rem; margin-bottom: 4px;">Hello, good day! 👋</h2>
        <p style="color: var(--text-muted); font-size: 0.85rem;">Welcome to your personal reminder.</p>
      </div>

      <!-- Stats Grid -->
      <div class="stats-grid" style="margin-bottom: 12px;">
        <div class="stat-box" onclick="showTab('people')">
          <div class="stat-label">People</div>
          <div id="stat-people" class="stat-number">0</div>
        </div>
        <div class="stat-box" onclick="showTab('reminders')">
          <div class="stat-label">Reminders</div>
          <div id="stat-reminders" class="stat-number">0</div>
        </div>
      </div>

      <!-- Upcoming Birthdays -->
      <div class="glass-card" style="margin-bottom: 12px;">
        <div class="card-header">
          <div class="card-title">🎂 Upcoming Birthdays</div>
          <button class="btn btn-secondary btn-sm" onclick="showTab('people')">View All</button>
        </div>
        <div id="dashboard-birthdays-list" class="item-list"></div>
      </div>

      <!-- Upcoming Reminders -->
      <div class="glass-card">
        <div class="card-header">
          <div class="card-title">⏰ Upcoming Reminders</div>
          <button class="btn btn-secondary btn-sm" onclick="showTab('reminders')">View All</button>
        </div>
        <div id="dashboard-reminders-list" class="item-list"></div>
      </div>
    </section>

    <!-- View 2: People -->
    <section id="view-people" class="tab-view hidden">
      <div class="glass-card">
        <div class="card-header">
          <div class="card-title">👥 People</div>
          <button class="btn btn-sm" onclick="openAddPersonModal()">➕ Add Person</button>
        </div>
        <div id="people-list-container" class="item-list"></div>
      </div>
    </section>

    <!-- View 3: Reminders -->
    <section id="view-reminders" class="tab-view hidden">
      <!-- Templates Card -->
      <div class="glass-card" style="margin-bottom: 12px;">
        <div class="card-header" style="margin-bottom: 8px;">
          <div class="card-title" style="font-size: 0.95rem;">📋 Birthday Reminder Templates</div>
        </div>
        <p style="font-size: 0.8rem; color: var(--text-muted); margin-bottom: 10px;">Select a preset to quickly apply a reminder to any contact:</p>
        <div style="display: flex; flex-wrap: wrap; gap: 8px;">
          <button class="btn btn-secondary btn-sm" onclick="openTemplateWizard(0, 'On the day')">🎯 On the day (0d)</button>
          <button class="btn btn-secondary btn-sm" onclick="openTemplateWizard(1, '1 day before')">⏰ 1 day before</button>
          <button class="btn btn-secondary btn-sm" onclick="openTemplateWizard(3, '3 days before')">📅 3 days before</button>
          <button class="btn btn-secondary btn-sm" onclick="openTemplateWizard(7, '1 week before')">🗓️ 1 week before</button>
          <button class="btn btn-secondary btn-sm" onclick="openTemplateWizard(14, '2 weeks before')">⏳ 2 weeks before</button>
          <button class="btn btn-secondary btn-sm" onclick="openTemplateWizard(30, '1 month before')">🗓️ 1 month before</button>
        </div>
      </div>

      <div class="glass-card">
        <div class="card-header">
          <div class="card-title">⏰ Active Reminders</div>
          <button class="btn btn-sm" onclick="openReminderWizard()">➕ Create Reminder</button>
        </div>
        <div id="reminders-list-container" class="item-list"></div>
      </div>
    </section>

    <!-- View 4: Profile -->
    <section id="view-profile" class="tab-view hidden">
      <div class="glass-card">
        <div class="card-header">
          <div class="card-title">👤 My Profile</div>
        </div>
        <div class="input-group">
          <label>Name</label>
          <input id="profile-name-input" class="input-control" type="text" />
        </div>
        <div class="input-group">
          <label>Birthday</label>
          <input id="profile-birthday-date" class="input-control" type="date" style="color-scheme: dark;" />
        </div>
        <button id="btn-save-profile" class="btn btn-full" onclick="saveProfile()">Save Profile</button>
      </div>
    </section>
  </main>

  <!-- Bottom Navigation -->
  <nav id="user-nav" class="bottom-nav">
    <button id="nav-tab-dashboard" class="nav-tab active" onclick="showTab('dashboard')">
      <span class="icon">🏠</span>
      <span>Home</span>
    </button>
    <button id="nav-tab-people" class="nav-tab" onclick="showTab('people')">
      <span class="icon">👥</span>
      <span>People</span>
    </button>
    <button id="nav-tab-reminders" class="nav-tab" onclick="showTab('reminders')">
      <span class="icon">⏰</span>
      <span>Reminders</span>
    </button>
    <button id="nav-tab-profile" class="nav-tab" onclick="showTab('profile')">
      <span class="icon">👤</span>
      <span>Profile</span>
    </button>
  </nav>

  <!-- Modals Container -->
  <div id="modal-backdrop" class="modal-backdrop hidden" onclick="closeModal(event)">
    <div class="modal-content" onclick="event.stopPropagation()">
      <div id="modal-body"></div>
    </div>
  </div>

  <script type="module">
    let authToken = localStorage.getItem("auth_token") || "";
    let currentUser = null;
    let authPromise = null;

    const tg = window.Telegram?.WebApp;
    if (tg) {
      tg.ready();
      tg.expand();
    }

    function showToast(message, type = "success") {
      const container = document.getElementById("toast-container");
      const toast = document.createElement("div");
      toast.className = `toast ${type}`;
      toast.innerHTML = `<span>${type === "success" ? "✓" : "⚠️"}</span> <span>${escapeHtml(message)}</span>`;
      container.appendChild(toast);
      setTimeout(() => { toast.remove(); }, 3500);
    }

    async function ensureAuth(forceRefresh = false) {
      if (authToken && !forceRefresh && currentUser) {
        return authToken;
      }

      if (authPromise) return authPromise;

      authPromise = (async () => {
        try {
          if (forceRefresh) {
            authToken = "";
            localStorage.removeItem("auth_token");
            currentUser = null;
          }

          // 1. If inside Telegram WebApp, authenticate with initData
          if (tg && tg.initData) {
            try {
              const res = await fetch("/api/auth/telegram", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ initData: tg.initData }),
                signal: AbortSignal.timeout(12000),
              });
              const data = await res.json().catch(() => ({}));
              if (data.token) {
                authToken = data.token;
                localStorage.setItem("auth_token", authToken);
                currentUser = data.user;
                return authToken;
              }
            } catch (e) {
              console.warn("Telegram initData auth error:", e);
            }
          }

          // 2. If token exists in localStorage, verify it by calling /api/dashboard
          if (authToken) {
            try {
              const res = await fetch("/api/dashboard", {
                headers: { "Authorization": `Bearer ${authToken}` },
                signal: AbortSignal.timeout(12000),
              });
              if (res.ok) {
                const data = await res.json().catch(() => ({}));
                if (data.user) {
                  currentUser = data.user;
                  return authToken;
                }
              }
            } catch (e) {
              console.warn("Token verification error:", e);
            }
            // Token is expired or invalid, clear it
            authToken = "";
            localStorage.removeItem("auth_token");
            currentUser = null;
          }
        } catch (e) {
          console.error("Authentication error:", e);
        } finally {
          authPromise = null;
        }
        return authToken;
      })();

      return authPromise;
    }

    async function apiRequest(endpoint, method = "GET", body = null, isRetry = false) {
      if (endpoint !== "/api/auth/telegram") {
        await ensureAuth();
      }

      const headers = { "Content-Type": "application/json" };
      if (authToken) {
        headers["Authorization"] = `Bearer ${authToken}`;
      }

      const options = { method, headers, signal: AbortSignal.timeout(12000) };
      if (body) options.body = JSON.stringify(body);

      try {
        const res = await fetch(endpoint, options);

        // Auto-retry on 401 Unauthorized once by re-authenticating
        if (res.status === 401 && !isRetry && endpoint !== "/api/auth/telegram") {
          console.warn(`401 received on ${endpoint}, refreshing authentication...`);
          await ensureAuth(true);
          return apiRequest(endpoint, method, body, true);
        }

        let data = {};
        const text = await res.text();
        try {
          data = JSON.parse(text);
        } catch {
          data = { error: text.slice(0, 300) || `HTTP ${res.status} ${res.statusText}` };
        }

        if (!res.ok) {
          let errorMsg = data.error || `HTTP ${res.status}: ${res.statusText}`;
          if (res.status === 504) {
            errorMsg = `504 Gateway Timeout: Server / database took too long to respond on ${endpoint}.`;
          } else if (res.status === 502) {
            errorMsg = `502 Bad Gateway: Upstream server error on ${endpoint}.`;
          }
          if (data.details && !errorMsg.includes(data.details)) {
            errorMsg += ` (${data.details})`;
          }
          throw new Error(errorMsg);
        }
        return data;
      } catch (err) {
        if (err.name === "TimeoutError" || err.name === "AbortError") {
          const timeoutErr = new Error(`Request timed out (12s) on ${endpoint}. Server or database is unreachable.`);
          console.error(timeoutErr);
          throw timeoutErr;
        }
        console.error(`API Error on [${method}] ${endpoint}:`, err);
        throw err;
      }
    }

    window.openTemplateWizard = async function(daysBefore, label) {
      try {
        const peopleRes = await apiRequest("/api/people");
        const people = peopleRes.people || [];
        const peopleWithBday = people.filter(p => p.birthday);

        if (peopleWithBday.length === 0) {
          document.getElementById("modal-body").innerHTML = `
            <h3 style="margin-bottom: 8px;">📋 Template: ${escapeHtml(label)}</h3>
            <p style="font-size: 0.85rem; color: var(--text-muted); margin-bottom: 14px;">None of your contacts have a birthday set yet.</p>
            <div style="display: flex; gap: 8px;">
              <button class="btn btn-full" onclick="openAddPersonModal()">➕ Add Contact First</button>
              <button class="btn btn-secondary btn-full" onclick="closeModal()">Cancel</button>
            </div>
          `;
          document.getElementById("modal-backdrop").classList.remove("hidden");
          return;
        }

        document.getElementById("modal-body").innerHTML = `
          <h3 style="margin-bottom: 4px;">📋 Template: ${escapeHtml(label)}</h3>
          <p style="font-size: 0.85rem; color: var(--text-muted); margin-bottom: 12px;">Choose a contact to activate <b>${escapeHtml(label)}</b> reminder:</p>
          <div class="item-list" style="max-height: 220px; overflow-y: auto; margin-bottom: 14px;">
            ${peopleWithBday.map(p => `
              <div class="list-item" style="padding: 10px 14px; cursor: pointer;" onclick="applyTemplateToPerson('${p.id}', ${daysBefore}, '${escapeHtml(p.name)}', '${escapeHtml(label)}')">
                <div class="item-title">👤 ${escapeHtml(p.name)}</div>
                <div class="item-subtitle">🎂 ${escapeHtml(p.formattedBirthday)}</div>
              </div>
            `).join("")}
          </div>
          <button class="btn btn-secondary btn-full" onclick="closeModal()">Cancel</button>
        `;
        document.getElementById("modal-backdrop").classList.remove("hidden");
      } catch (err) {
        showToast(err.message, "error");
      }
    };

    window.applyTemplateToPerson = async function(personId, daysBefore, personName, label) {
      try {
        await apiRequest(`/api/people/${personId}/birthday-reminders/custom`, "POST", { daysBefore });
        showToast(`Activated ${label} for ${personName}!`);
        closeModal();
        await loadReminders();
        await loadDashboard();
      } catch (err) {
        showToast(err.message, "error");
      }
    };

    window.selectWizardPerson = function(personId, personName, birthday) {
      if (!birthday) {
        document.getElementById("modal-body").innerHTML = `
          <h3 style="margin-bottom: 8px;">🎂 ${escapeHtml(personName)}'s Birthday</h3>
          <p style="color: var(--text-muted); font-size: 0.9rem; margin-bottom: 16px;">This person does not have a birthday set yet.</p>
          <div style="display: flex; gap: 8px;">
            <button class="btn btn-full" onclick="openEditPersonModal('${personId}')">🎂 Add Birthday</button>
            <button class="btn btn-secondary btn-full" onclick="closeModal()">Cancel</button>
          </div>
        `;
        return;
      }

      document.getElementById("modal-body").innerHTML = `
        <h3 style="margin-bottom: 4px;">🎂 ${escapeHtml(personName)}</h3>
        <p style="color: var(--text-muted); font-size: 0.85rem; margin-bottom: 14px;">Birthday: <b>${escapeHtml(birthday)}</b></p>
        <p style="font-size: 0.9rem; font-weight: 600; margin-bottom: 10px;">Select Reminder Presets:</p>

        <div style="margin-bottom: 14px; display: flex; flex-direction: column; gap: 6px;">
          <label class="checkbox-item"><input type="checkbox" id="wiz-off-0" checked /> <span>🎯 On the day (0 days before)</span></label>
          <label class="checkbox-item"><input type="checkbox" id="wiz-off-1" /> <span>⏰ 1 day before</span></label>
          <label class="checkbox-item"><input type="checkbox" id="wiz-off-3" /> <span>📅 3 days before</span></label>
          <label class="checkbox-item"><input type="checkbox" id="wiz-off-7" /> <span>🗓️ 1 week before</span></label>
          <label class="checkbox-item"><input type="checkbox" id="wiz-off-14" /> <span>⏳ 2 weeks before</span></label>
          <label class="checkbox-item"><input type="checkbox" id="wiz-off-30" /> <span>🗓️ 1 month before</span></label>
        </div>

        <div class="input-group">
          <label>Reminder Time</label>
          <input id="wiz-time" class="input-control" type="time" value="09:00" />
        </div>

        <div style="display: flex; gap: 8px; margin-top: 14px;">
          <button id="btn-save-wizard-rem" class="btn btn-full" onclick="submitWizardBirthdayReminders('${personId}', '${escapeHtml(personName)}')">Save Reminders</button>
          <button class="btn btn-secondary btn-full" onclick="closeModal()">Cancel</button>
        </div>
      `;
    };

    window.submitWizardBirthdayReminders = async function(personId, personName) {
      const btn = document.getElementById("btn-save-wizard-rem");
      btn.innerText = "Saving...";
      btn.disabled = true;

      const offsets = [
        { days: 0, checked: document.getElementById("wiz-off-0")?.checked },
        { days: 1, checked: document.getElementById("wiz-off-1")?.checked },
        { days: 3, checked: document.getElementById("wiz-off-3")?.checked },
        { days: 7, checked: document.getElementById("wiz-off-7")?.checked },
        { days: 14, checked: document.getElementById("wiz-off-14")?.checked },
        { days: 30, checked: document.getElementById("wiz-off-30")?.checked },
      ];

      const reminderTime = document.getElementById("wiz-time")?.value || "09:00";

      try {
        const promises = offsets
          .filter(o => o.checked)
          .map(o => apiRequest(`/api/people/${personId}/birthday-reminders/custom`, "POST", { daysBefore: o.days }));
        
        promises.push(apiRequest(`/api/people/${personId}/birthday-reminders/time`, "POST", { reminderTime }));
        await Promise.all(promises);

        showToast(`Reminders saved for ${personName}!`);
        closeModal();
        Promise.all([loadReminders(), loadDashboard()]).catch(() => {});
      } catch (err) {
        showToast(err.message, "error");
      } finally {
        btn.innerText = "Save Reminders";
        btn.disabled = false;
      }
    };

    window.openOneTimeReminderModal = function() {
      document.getElementById("modal-body").innerHTML = `
        <h3 style="margin-bottom: 12px;">⏰ One-Time Reminder</h3>
        <div class="input-group">
          <label>Title *</label>
          <input id="new-rem-title" class="input-control" type="text" placeholder="Buy gift" />
        </div>
        <div class="input-group">
          <label>Date & Time *</label>
          <input id="new-rem-date" class="input-control" type="datetime-local" />
        </div>
        <div class="input-group">
          <label>Recurrence</label>
          <select id="new-rem-repeat" class="input-control">
            <option value="none">No</option>
            <option value="daily">Every day</option>
            <option value="weekly">Every week</option>
            <option value="monthly">Every month</option>
            <option value="yearly">Every year</option>
          </select>
        </div>
        <div style="display: flex; gap: 8px; margin-top: 14px;">
          <button id="btn-submit-rem" class="btn btn-full" onclick="submitAddReminder()">Save</button>
          <button class="btn btn-secondary btn-full" onclick="closeModal()">Cancel</button>
        </div>
      `;
      document.getElementById("modal-backdrop").classList.remove("hidden");
    };

    window.submitAddReminder = async function() {
      const btn = document.getElementById("btn-submit-rem");
      const title = document.getElementById("new-rem-title").value.trim();
      const dateVal = document.getElementById("new-rem-date").value;
      const repeatType = document.getElementById("new-rem-repeat").value;

      if (!title || !dateVal) {
        showToast("Title and date/time are required", "error");
        return;
      }

      btn.innerText = "Saving...";
      btn.disabled = true;

      try {
        await apiRequest("/api/reminders", "POST", {
          title,
          scheduledAt: dateVal, // Pass direct string to preserve selected hour in user timezone
          repeatType,
        });
        showToast("Reminder created!");
        closeModal();
        await loadReminders();
        await loadDashboard();
      } catch (err) {
        showToast(err.message, "error");
      } finally {
        btn.innerText = "Save";
        btn.disabled = false;
      }
    };

    // POPUP BIRTHDAY PICKER MODAL FOR PROFILE & CONTACTS
    let tempPickerMonth = "01";
    let tempPickerDay = "01";

    window.openProfileBirthdayPicker = function() {
      const currentVal = document.getElementById("profile-birthday-input")?.value || "";
      if (currentVal && currentVal.includes("-")) {
        const [m, d] = currentVal.split("-");
        tempPickerMonth = m.padStart(2, "0");
        tempPickerDay = d.padStart(2, "0");
      }

      renderBirthdayPickerModal();
      document.getElementById("modal-backdrop").classList.remove("hidden");
    };

    window.renderBirthdayPickerModal = function() {
      const months = [
        { id: "01", name: "Jan" }, { id: "02", name: "Feb" }, { id: "03", name: "Mar" },
        { id: "04", name: "Apr" }, { id: "05", name: "May" }, { id: "06", name: "Jun" },
        { id: "07", name: "Jul" }, { id: "08", name: "Aug" }, { id: "09", name: "Sep" },
        { id: "10", name: "Oct" }, { id: "11", name: "Nov" }, { id: "12", name: "Dec" },
      ];

      const daysCount = ["02"].includes(tempPickerMonth) ? 29 : ["04", "06", "09", "11"].includes(tempPickerMonth) ? 30 : 31;

      document.getElementById("modal-body").innerHTML = `
        <h3 style="margin-bottom: 6px;">🎂 Select Birthday</h3>
        <p style="color: var(--text-muted); font-size: 0.85rem; margin-bottom: 12px;">Selected: <b style="color: var(--accent-primary);">${getMonthName(tempPickerMonth)} ${parseInt(tempPickerDay, 10)}</b></p>
        
        <p style="font-size: 0.8rem; font-weight: 600; color: var(--text-muted); margin-bottom: 6px;">1. Month</p>
        <div style="display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; margin-bottom: 14px;">
          ${months.map(m => `
            <button type="button" class="btn ${m.id === tempPickerMonth ? '' : 'btn-secondary'} btn-sm" style="padding: 6px 4px; font-size: 0.8rem;" onclick="setPickerMonth('${m.id}')">${m.name}</button>
          `).join('')}
        </div>

        <p style="font-size: 0.8rem; font-weight: 600; color: var(--text-muted); margin-bottom: 6px;">2. Day</p>
        <div style="display: grid; grid-template-columns: repeat(7, 1fr); gap: 5px; max-height: 150px; overflow-y: auto; margin-bottom: 14px;">
          ${Array.from({length: daysCount}, (_, i) => {
            const dStr = String(i + 1).padStart(2, "0");
            const isSelected = dStr === tempPickerDay;
            return `<button type="button" class="btn ${isSelected ? '' : 'btn-secondary'} btn-sm" style="padding: 6px 0; font-size: 0.8rem;" onclick="setPickerDay('${dStr}')">${i + 1}</button>`;
          }).join('')}
        </div>

        <div style="display: flex; gap: 8px;">
          <button type="button" class="btn btn-full" onclick="confirmProfileBirthday()">Confirm</button>
          <button type="button" class="btn btn-secondary btn-full" onclick="clearProfileBirthday()">Clear</button>
          <button type="button" class="btn btn-secondary btn-sm" onclick="closeModal()">Cancel</button>
        </div>
      `;
    };

    window.setPickerMonth = function(m) {
      tempPickerMonth = m;
      renderBirthdayPickerModal();
    };

    window.setPickerDay = function(d) {
      tempPickerDay = d;
      renderBirthdayPickerModal();
    };

    window.confirmProfileBirthday = function() {
      const bdayStr = `${tempPickerMonth}-${tempPickerDay}`;
      document.getElementById("profile-birthday-input").value = bdayStr;
      document.getElementById("profile-birthday-display").value = `${getMonthName(tempPickerMonth)} ${parseInt(tempPickerDay, 10)}`;
      closeModal();
    };

    window.clearProfileBirthday = function() {
      document.getElementById("profile-birthday-input").value = "";
      document.getElementById("profile-birthday-display").value = "";
      closeModal();
    };

    function getMonthName(m) {
      const map = {
        "01": "January", "02": "February", "03": "March", "04": "April",
        "05": "May", "06": "June", "07": "July", "08": "August",
        "09": "September", "10": "October", "11": "November", "12": "December"
      };
      return map[m] || m;
    }

    function renderReminders(remList) {
      const container = document.getElementById("reminders-list-container");
      if (remList && remList.length > 0) {
        container.innerHTML = remList.map(r => `
          <div class="list-item">
            <div class="item-info">
              <div class="item-title">${escapeHtml(r.title)}</div>
              <div class="item-subtitle">${r.dateStr} at ${r.timeStr}${r.personName ? " (👤 " + escapeHtml(r.personName) + ")" : ""}</div>
            </div>
            <div>
              <button class="btn btn-secondary btn-sm" onclick="deleteReminder('${r.id}')" title="Delete">🗑</button>
            </div>
          </div>
        `).join("");
      } else {
        container.innerHTML = `
          <div class="empty-state">
            <div class="empty-state-icon">⏰</div>
            <div class="empty-state-title">No reminders yet</div>
            <div class="empty-state-desc">Create a reminder for a person's birthday or another important date.</div>
            <button class="btn" onclick="openReminderWizard()">➕ Create Reminder</button>
          </div>
        `;
      }
    }

    async function loadReminders() {
      const container = document.getElementById("reminders-list-container");
      try {
        const res = await apiRequest("/api/reminders");
        appCache.reminders = res.reminders || [];
        renderReminders(appCache.reminders);
      } catch (err) {
        if (!appCache.reminders) {
          container.innerHTML = `<p style="color: var(--danger);">${escapeHtml(err.message)}</p>`;
        }
      }
    }

    window.deleteReminder = async function(id) {
      if (!confirm("Delete this reminder?")) return;
      // Optimistic delete
      if (appCache.reminders) {
        appCache.reminders = appCache.reminders.filter(r => r.id !== id);
        renderReminders(appCache.reminders);
      }
      try {
        await apiRequest(`/api/reminders/${id}`, "DELETE");
        showToast("Reminder deleted.");
        Promise.all([loadReminders(), loadDashboard()]).catch(() => {});
      } catch (err) {
        showToast(err.message, "error");
        loadReminders();
      }
    };

    function renderProfile(user) {
      if (!user) return;
      document.getElementById("profile-name-input").value = user.name || "";
      if (user.birthday) {
        document.getElementById("profile-birthday-date").value = `2026-${user.birthday}`;
      } else {
        document.getElementById("profile-birthday-date").value = "";
      }
    }

    // PROFILE
    async function loadProfile() {
      try {
        const res = await apiRequest("/api/profile");
        if (res.user) {
          appCache.profile = res.user;
          renderProfile(res.user);
        }
      } catch (err) {
        console.error("Error loading profile:", err);
      }
    }

    window.saveProfile = async function() {
      const btn = document.getElementById("btn-save-profile");
      btn.innerText = "Saving...";
      btn.disabled = true;

      const name = document.getElementById("profile-name-input").value.trim();
      let rawBday = document.getElementById("profile-birthday-date").value.trim();
      let birthday = null;
      if (rawBday && rawBday.includes("-")) {
        const parts = rawBday.split("-");
        if (parts.length === 3) birthday = `${parts[1]}-${parts[2]}`;
        else if (parts.length === 2) birthday = rawBday;
      }

      try {
        await apiRequest("/api/profile", "PUT", { name, birthday, timezone: "Asia/Tehran" });
        showToast("Profile updated!");
        loadDashboard();
      } catch (err) {
        showToast(err.message, "error");
      } finally {
        btn.innerText = "Save Profile";
        btn.disabled = false;
      }
    };

    window.closeModal = function() {
      document.getElementById("modal-backdrop").classList.add("hidden");
    };

    function escapeHtml(text) {
      if (!text) return "";
      return String(text)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;");
    }

    function debounce(func, wait) {
      let timeout;
      return function(...args) {
        clearTimeout(timeout);
        timeout = setTimeout(() => func.apply(this, args), wait);
      };
    }

    initApp();
  </script>
</body>
</html>
