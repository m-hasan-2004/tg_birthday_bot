name: Reminder Notification Cron

on:
  schedule:
    # Runs every 5 minutes
    - cron: '*/5 * * * *'
  workflow_dispatch:

jobs:
  trigger-reminders:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Vercel /api/cron every minute
        run: |
          echo "Starting 1-minute precision reminder dispatch loop..."
          for i in {1..5}; do
            echo "Dispatch iteration $i at $(date)"
            curl -s -X POST "https://tg-birthday-bot.vercel.app/api/cron" || curl -s "https://tg-birthday-bot.vercel.app/api/cron"
            if [ $i -lt 5 ]; then
              sleep 60
            fi
          done
          echo "Done."
