name: Reminder Notification Cron

on:
  schedule:
    # Runs every 5 minutes
    - cron: '*/5 * * * *'
  workflow_dispatch:

jobs:
  trigger-reminders:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Vercel /api/cron
        run: |
          echo "Triggering birthday and reminder notification dispatch..."
          curl -s -X POST "https://tg-birthday-bot.vercel.app/api/cron" || curl -s "https://tg-birthday-bot.vercel.app/api/cron"
          echo "Done."
