name: Reminder Notification Cron

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

concurrency:
  group: cron-runner
  cancel-in-progress: true

jobs:
  trigger-reminders:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Continuous 60s Reminder Dispatch Loop
        run: |
          echo "Starting continuous 60-second reminder dispatch loop..."
          # Loop for 15 minutes (900 seconds), pinging /api/cron every 60 seconds
          END_TIME=$((SECONDS + 900))
          while [ $SECONDS -lt $END_TIME ]; do
            echo "[$(date -u)] Pinging /api/cron..."
            curl -s -f -X POST "https://tg-birthday-bot.vercel.app/api/cron" || curl -s -f "https://tg-birthday-bot.vercel.app/api/cron"
            sleep 60
          done
          echo "Dispatch cycle complete."
